[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]
aptPkgs = ["unzip", "curl"]

[phases.install]
cmds = [
  "curl -fsSL https://bun.sh/install | bash && export BUN_INSTALL=\"$HOME/.bun\" && export PATH=\"$BUN_INSTALL/bin:$PATH\" && pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "export BUN_INSTALL=\"$HOME/.bun\" && export PATH=\"$BUN_INSTALL/bin:$PATH\" && pnpm run build",
  "cp -r /root/.bun /app/.bun"  # Copy bun to app directory for runtime
]

[start]
# Force API to run from source - v2
cmd = "export BUN_INSTALL=\"/app/.bun\" && export PATH=\"$BUN_INSTALL/bin:$PATH\" && cd /app/apps/api && rm -rf dist && cd /app && pnpm start"