[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]
aptPkgs = ["unzip", "curl"]

[phases.install]
cmds = [
  "curl -fsSL https://bun.sh/install | bash && export BUN_INSTALL=\"$HOME/.bun\" && export PATH=\"$BUN_INSTALL/bin:$PATH\" && pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "export BUN_INSTALL=\"$HOME/.bun\" && export PATH=\"$BUN_INSTALL/bin:$PATH\" && pnpm run build",
  "rm -rf /app/apps/api/dist",  # DELETE dist folder after build
  "cp -r /root/.bun /app/.bun"  # Copy bun to app directory for runtime
]

[start]
# Use custom start script to bypass pnpm issues
cmd = "export BUN_INSTALL=\"/app/.bun\" && export PATH=\"$BUN_INSTALL/bin:$PATH\" && chmod +x /app/start-production.sh && /app/start-production.sh"