[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]

[phases.install]
cmds = [
  "curl -fsSL https://bun.sh/install | bash",
  "export BUN_INSTALL=\"$HOME/.bun\"",
  "export PATH=\"$BUN_INSTALL/bin:$PATH\"",
  "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "export BUN_INSTALL=\"$HOME/.bun\"",
  "export PATH=\"$BUN_INSTALL/bin:$PATH\"",
  "pnpm run build"
]

[start]
cmd = "pnpm start"
