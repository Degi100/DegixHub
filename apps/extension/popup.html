<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DegixHub - Save Link</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 400px;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1a1a1a;
        color: #e5e5e5;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid #333;
      }

      .logo {
        width: 24px;
        height: 24px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 6px;
      }

      h1 {
        font-size: 18px;
        font-weight: 600;
      }

      .status {
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 13px;
        margin-bottom: 16px;
        display: none;
      }

      .status.success {
        background: #10b981;
        color: white;
        display: block;
      }

      .status.error {
        background: #ef4444;
        color: white;
        display: block;
      }

      .status.info {
        background: #3b82f6;
        color: white;
        display: block;
      }

      .auth-section {
        display: none;
      }

      .auth-section.active {
        display: block;
      }

      .form-section {
        display: none;
      }

      .form-section.active {
        display: block;
      }

      .form-group {
        margin-bottom: 12px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 500;
        color: #a3a3a3;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #333;
        border-radius: 6px;
        background: #262626;
        color: #e5e5e5;
        font-size: 14px;
        font-family: inherit;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: #667eea;
      }

      textarea {
        resize: vertical;
        min-height: 60px;
      }

      button {
        width: 100%;
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-primary:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }

      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .btn-secondary {
        background: #333;
        color: #e5e5e5;
        margin-top: 8px;
      }

      .btn-secondary:hover {
        background: #404040;
      }

      .loading {
        display: none;
        text-align: center;
        padding: 20px;
        color: #a3a3a3;
      }

      .loading.active {
        display: block;
      }

      .footer {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid #333;
        text-align: center;
        font-size: 12px;
        color: #737373;
      }

      .footer a {
        color: #667eea;
        text-decoration: none;
      }

      .footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo"></div>
      <h1>DegixHub</h1>
    </div>

    <div id="status" class="status"></div>

    <!-- Authentication Section -->
    <div id="authSection" class="auth-section">
      <p style="margin-bottom: 16px; font-size: 14px; color: #a3a3a3;">
        Please configure your DegixHub API URL and authenticate.
      </p>
      <div class="form-group">
        <label for="apiUrl">API URL</label>
        <input
          type="text"
          id="apiUrl"
          placeholder="http://localhost:3000"
          value="http://localhost:3000"
        />
      </div>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" />
      </div>
      <button id="loginBtn" class="btn-primary">Login</button>
    </div>

    <!-- Loading Section -->
    <div id="loading" class="loading">
      <p>Loading...</p>
    </div>

    <!-- Save Link Form -->
    <div id="formSection" class="form-section">
      <div class="form-group">
        <label for="linkName">Name *</label>
        <input type="text" id="linkName" placeholder="Link name" required />
      </div>

      <div class="form-group">
        <label for="linkUrl">URL *</label>
        <input type="url" id="linkUrl" placeholder="https://example.com" required />
      </div>

      <div class="form-group">
        <label for="linkCategory">Category</label>
        <select id="linkCategory">
          <option value="General">General</option>
          <option value="Work">Work</option>
          <option value="Personal">Personal</option>
          <option value="Development">Development</option>
          <option value="Design">Design</option>
          <option value="Documentation">Documentation</option>
          <option value="Social">Social</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Shopping">Shopping</option>
          <option value="News">News</option>
        </select>
      </div>

      <div class="form-group">
        <label for="linkDescription">Description</label>
        <textarea id="linkDescription" placeholder="Optional description"></textarea>
      </div>

      <button id="saveBtn" class="btn-primary">Save Link</button>
      <button id="logoutBtn" class="btn-secondary">Logout</button>
    </div>

    <div class="footer">
      <a href="#" id="openDashboard">Open Dashboard</a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
