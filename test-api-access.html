<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
</head>
<body>
    <h1>Testing API Access on Port 3003</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');

        async function testAPI() {
            // Test 1: Direct API health check
            try {
                results.innerHTML += '<p>Testing direct API access on port 3003...</p>';
                const response1 = await fetch('http://degixhub.94.130.185.204.sslip.io:3003', {
                    method: 'GET',
                    mode: 'no-cors' // Bypass CORS for testing
                });
                results.innerHTML += '<p style="color: green">✓ Port 3003 seems reachable (no timeout)</p>';
            } catch (error) {
                results.innerHTML += '<p style="color: red">✗ Port 3003 not accessible: ' + error.message + '</p>';
            }

            // Test 2: tRPC endpoint
            try {
                results.innerHTML += '<p>Testing tRPC endpoint...</p>';
                const response2 = await fetch('http://degixhub.94.130.185.204.sslip.io:3003/trpc/auth.getSession', {
                    method: 'GET',
                    credentials: 'include'
                });

                if (response2.ok) {
                    const data = await response2.json();
                    results.innerHTML += '<p style="color: green">✓ tRPC API is working! Response: ' + JSON.stringify(data) + '</p>';
                } else {
                    results.innerHTML += '<p style="color: orange">⚠ tRPC responded with status: ' + response2.status + '</p>';
                }
            } catch (error) {
                results.innerHTML += '<p style="color: red">✗ tRPC endpoint error: ' + error.message + '</p>';
            }

            // Test 3: Login endpoint simulation
            try {
                results.innerHTML += '<p>Testing login endpoint...</p>';
                const loginData = {
                    0: {
                        json: {
                            username: "test",
                            password: "test"
                        }
                    }
                };

                const response3 = await fetch('http://degixhub.94.130.185.204.sslip.io:3003/trpc/auth.login?batch=1', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(loginData),
                    credentials: 'include'
                });

                if (response3.ok) {
                    const data = await response3.json();
                    results.innerHTML += '<p style="color: green">✓ Login endpoint is reachable! Response: ' + JSON.stringify(data) + '</p>';
                } else {
                    results.innerHTML += '<p style="color: orange">⚠ Login endpoint responded with status: ' + response3.status + '</p>';
                }
            } catch (error) {
                results.innerHTML += '<p style="color: red">✗ Login endpoint error: ' + error.message + '</p>';
            }

            results.innerHTML += '<hr><p><strong>Test completed!</strong></p>';
        }

        // Run tests immediately
        testAPI();
    </script>
</body>
</html>
