version: '3.8'

services:
  # Einzelner Container mit beiden Services (für Nixpacks/Coolify)
  app:
    build:
      context: .
      dockerfile: Dockerfile  # Nixpacks generiert das
    ports:
      - "3002:3002"  # Web Frontend
      - "3003:3003"  # API Backend
    environment:
      # API Env Vars
      - DATABASE_URL=file:/data/production.db
      - PORT=3003
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-https://hub.reneschmidt.de}
      # Web Env Vars
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://hub-api.reneschmidt.de}
      - NODE_ENV=production
    volumes:
      - hub-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Alternative: Zwei separate Services (für custom Docker Setup)
  # Auskommentiert - nutze entweder oben ODER diese beiden
  # api:
  #   build:
  #     context: .
  #     dockerfile: apps/api/Dockerfile
  #   ports:
  #     - "3001:3001"
  #   environment:
  #     - DATABASE_URL=file:/data/production.db
  #     - PORT=3001
  #     - NODE_ENV=production
  #     - FRONTEND_URL=${FRONTEND_URL:-https://hub.reneschmidt.de}
  #     - ENCRYPTION_KEY=${ENCRYPTION_KEY}
  #   volumes:
  #     - hub-data:/data
  #   restart: unless-stopped

  # web:
  #   build:
  #     context: .
  #     dockerfile: apps/web/Dockerfile
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://hub-api.reneschmidt.de}
  #     - NODE_ENV=production
  #   depends_on:
  #     - api
  #   restart: unless-stopped

volumes:
  hub-data:
    driver: local
