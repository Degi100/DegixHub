# Coolify Configuration
# This file tells Coolify exactly how to deploy our app

# Port Configuration
ports:
  - "3002:3002"  # Frontend (Next.js)
  - "3003:3003"  # Backend (API)

# Health checks
healthcheck:
  test: ["CMD", "curl", "-f", "http://localhost:3002"]
  interval: 30s
  timeout: 10s
  retries: 3

# Environment variables (will be merged with Coolify UI settings)
environment:
  PORT: "3003"
  NODE_ENV: "production"